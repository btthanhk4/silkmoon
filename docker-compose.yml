services:
  # Nginx Gateway with Zero-Code Bot Detection Injection
  gateway:
    image: nginx:alpine
    container_name: silkmoon-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # SilkMoon NestJS Backend API (Internal)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silkmoon-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000

  # SilkMoon Customer Frontend (Internal)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: silkmoon-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  # SilkMoon Admin Dashboard (Vite React + Nginx)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: silkmoon-admin
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - backend

networks:
  default:
    name: silkmoon-network
