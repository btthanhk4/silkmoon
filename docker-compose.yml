services:
  # SilkMoon NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silkmoon-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000

  # SilkMoon Customer Frontend (Vite React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_BOT_API_URL=/api/v1/telemetry
    container_name: silkmoon-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # SilkMoon Admin Dashboard (Vite React + Nginx)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: silkmoon-admin
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - backend

networks:
  default:
    name: silkmoon-network
