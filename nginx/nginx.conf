user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip settings for responses returned to clients
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size (matching NestJS 15MB limit with headroom)
    client_max_body_size 25M;

    # Upstream containers in Docker network
    upstream frontend_upstream {
        server silkmoon-frontend:80;
    }

    upstream backend_upstream {
        server silkmoon-backend:3000;
    }

    upstream bot_api_upstream {
        server bot-detection-api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. BOT DETECTION TELEMETRY INGESTION ENDPOINT
        location /api/v1/telemetry {
            proxy_pass http://bot_api_upstream/api/v1/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. SERVE BOT COLLECTOR SDK SCRIPT
        location = /bot-collector.js {
            proxy_pass http://bot_api_upstream/bot-collector.js;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600";
        }

        # 3. SILKMOON BACKEND API (NestJS)
        location /api/v1/ {
            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. SILKMOON UPLOADED ASSETS & AR 3D MODELS
        location /uploads/ {
            proxy_pass http://backend_upstream/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 5. SILKMOON FRONTEND WITH ZERO-CODE SDK INJECTION
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable upstream gzip so sub_filter can read and transform plain HTML
            proxy_set_header Accept-Encoding "";

            # AUTOMATIC ZERO-CODE INJECTION: Inject script into HTML before </body>
            sub_filter '</body>' '<script src="/bot-collector.js"></script><script>if(window.BotCollector){new BotCollector({endpoint:"/api/v1/telemetry",autoSendInterval:5000}).start();}</script></body>';
            sub_filter_types text/html;
            sub_filter_once on;
        }
    }
}
